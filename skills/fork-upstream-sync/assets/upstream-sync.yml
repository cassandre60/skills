name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      fetch_depth:
        description: 'Git fetch depth for upstream main'
        required: false
        default: '100'
      create_issue:
        description: 'Create or update GitHub issue for active candidates'
        required: false
        type: boolean
        default: true

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync upstream commits
        id: sync_step
        run: |
          depth="${{ github.event.inputs.fetch_depth || '100' }}"
          python3 .upstream/tracker.py sync --depth "$depth"

      - name: Generate candidate report
        id: report
        run: |
          python3 .upstream/tracker.py candidates --format markdown > candidates.md
          cat candidates.md
          candidates_count=$(jq '.stats.candidates // 0' .upstream/ledger.json)
          echo "candidates_count=$candidates_count" >> "$GITHUB_OUTPUT"

      - name: Update or Create GitHub Issue
        if: ${{ (steps.report.outputs.candidates_count > 0) && (github.event.inputs.create_issue != 'false') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync --color "0E8A16" --description "Upstream synchronization and review candidates" --force 2>/dev/null || true

          existing_issue=$(gh issue list --repo "${{ github.repository }}" --label "upstream-sync" --state open --json number --jq '.[0].number')

          if [ -n "$existing_issue" ]; then
            echo "Updating existing issue #$existing_issue"
            gh issue edit "$existing_issue" --repo "${{ github.repository }}" --body-file candidates.md
            gh issue comment "$existing_issue" --repo "${{ github.repository }}" --body "Updated candidate list from upstream sync run on $(date -u +%Y-%m-%d)."
          else
            echo "Creating new issue for upstream candidates"
            gh issue create --repo "${{ github.repository }}" \
              --title "[Upstream Tracker] Candidates from upstream ($(date -u +%Y-%m-%d))" \
              --label "upstream-sync" \
              --body-file candidates.md
          fi

      - name: Propose Ledger Update via PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet .upstream/ledger.json; then
            echo "Ledger changed. Submitting PR for ledger update..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B chore/upstream-ledger-sync
            git add .upstream/ledger.json
            git commit -m "chore(upstream): update sync ledger [skip ci]"
            git push -f origin chore/upstream-ledger-sync

            existing_pr=$(gh pr list --repo "${{ github.repository }}" --head chore/upstream-ledger-sync --state open --json number --jq '.[0].number')
            if [ -z "$existing_pr" ]; then
              gh pr create --repo "${{ github.repository }}" \
                --title "chore(upstream): update upstream sync ledger" \
                --body "Automated update of \`.upstream/ledger.json\` from weekly upstream synchronization." \
                --head chore/upstream-ledger-sync \
                --base main
            fi
          else
            echo "No ledger changes to commit."
          fi
