name: Check Skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r scripts/requirements.txt ruff pyright
      - name: Validate skills (frontmatter, structure, references, secrets)
        run: python3 scripts/check_skills.py
      - name: Verify every skill is discoverable by the skills installer
        run: scripts/check_discovery.sh
      - name: Verify README dynamic sections are fresh
        run: python3 scripts/generate_readme.py --check
      - name: Run root validation script unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run static lint and type checks (ruff + pyright)
        run: |
          ruff check --isolated --select E9,F --exclude skills/autonomous-improvement/evals/fixtures scripts/ skills/
          pyright scripts/ skills/agent-proof-codebase/ skills/autonomous-improvement/scripts/autonomous/ skills/autonomous-improvement/evals/run.py skills/cliproxy-integration/ skills/context-optimization/ skills/fork-upstream-sync/
      - name: Run the agent-proof-codebase test suite
        run: python3 -m unittest discover -s skills/agent-proof-codebase/tests -v
      - name: Run the cliproxy-integration test suite
        run: python3 -m unittest discover -s skills/cliproxy-integration/tests -v
      - name: Run the context-optimization test suite
        run: python3 -m unittest discover -s skills/context-optimization/tests -v
      - name: Run the fork-upstream-sync test suite
        run: python3 -m unittest discover -s skills/fork-upstream-sync/tests -v
      - name: Run the autonomous-improvement regression suite
        working-directory: skills/autonomous-improvement
        run: python3 -m unittest discover -s tests -v
      - name: Run the behavioral evals (deterministic halves, red-proof included)
        working-directory: skills/autonomous-improvement
        run: |
          python3 evals/run.py --deterministic
          python3 evals/run.py --negative-control --case E7-8-protected-row
      - name: Run the watchdog model-rotation test
        run: bash skills/autonomous-improvement/fleet-ops/tests/watchdog_rotation_test.sh
      - name: Run the stateless-wake launcher test
        run: bash skills/autonomous-improvement/fleet-ops/tests/stateless_wake_test.sh
