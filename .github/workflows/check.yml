name: Check Skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate skills (frontmatter, structure, references, secrets)
        run: python3 scripts/check_skills.py
      - name: Verify README dynamic sections are fresh
        run: python3 scripts/generate_readme.py --check
