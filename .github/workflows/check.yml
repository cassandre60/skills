name: Check Skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r scripts/requirements.txt
      - name: Validate skills (frontmatter, structure, references, secrets)
        run: python3 scripts/check_skills.py
      - name: Verify every skill is discoverable by the skills installer
        run: scripts/check_discovery.sh
      - name: Verify README dynamic sections are fresh
        run: python3 scripts/generate_readme.py --check
      - name: Run the autonomous-improvement regression suite
        working-directory: skills/autonomous-improvement
        run: python3 -m unittest discover -s tests -v
      - name: Run the watchdog model-rotation test
        run: bash skills/autonomous-improvement/tests/watchdog_rotation_test.sh
      - name: Run the stateless-wake launcher test
        run: bash skills/autonomous-improvement/tests/stateless_wake_test.sh
